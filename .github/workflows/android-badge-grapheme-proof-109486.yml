name: Android badge grapheme proof (PR 109486)

on:
  push:
    branches:
      - proof/android-badge-grapheme-109486

permissions:
  contents: read

concurrency:
  group: android-badge-grapheme-proof-109486-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PR_HEAD_SHA: 22f2be63225c5ac907c1b58050e59f4e964e0558

jobs:
  emulator-proof:
    if: github.repository == 'Leon-SK668/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Leon-SK668/openclaw
          ref: ${{ env.PR_HEAD_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C harness status --porcelain=v1 --untracked-files=all)"
          test "$(git -C target rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            target/apps/android/**/*.gradle*
            target/apps/android/**/gradle-wrapper.properties
            target/apps/android/gradle/libs.versions.toml

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.15.0'

      - name: Prepare proof artifacts
        shell: bash
        run: mkdir -p proof-artifacts

      - name: Enable KVM acceleration
        shell: bash
        run: sudo chmod 0666 /dev/kvm

      - name: Run API 36 emulator proof
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          system-image-api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          pre-emulator-launch-script: sdkmanager --install 'build-tools;36.0.0'
          working-directory: target/apps/android
          script: bash "${GITHUB_WORKSPACE}/harness/scripts/proof/android-badge-grapheme-109486/run.sh" "${GITHUB_WORKSPACE}/target" "${GITHUB_WORKSPACE}/harness" "${PR_HEAD_SHA}" "${GITHUB_WORKSPACE}/proof-artifacts"

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: android-badge-grapheme-proof-${{ env.PR_HEAD_SHA }}
          path: proof-artifacts
          if-no-files-found: warn
          retention-days: 7
