name: Gemini SecretRef exact-head proof 104672

on:
  push:
    branches:
      - proof/pr104672-gemini-secretref-20260720

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROOF_HARNESS_PARENT_SHA: a971188a6d0fa66514e7278ae9fdabc7571c7ead
      PROOF_TARGET_SHA: 01c4cb3bcc942d2a3a8af91ecd3aa3b2a9c860f9
    steps:
      - name: Check out trusted proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
          path: harness
          persist-credentials: false

      - name: Verify harness provenance
        working-directory: harness
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PROOF_HARNESS_PARENT_SHA"

      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Leon-SK668/openclaw
          ref: 01c4cb3bcc942d2a3a8af91ecd3aa3b2a9c860f9
          fetch-depth: 1
          path: target
          persist-credentials: false

      - name: Verify exact PR head
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "$PROOF_TARGET_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0

      - name: Install locked dependencies
        working-directory: target
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run exact-head SecretRef precedence and fail-closed proof
        working-directory: target
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { mkdir, writeFile } from "node:fs/promises";
          import { createServer } from "node:http";
          import { connect } from "node:net";
          import { createGeminiWebSearchProvider } from "./extensions/google/src/gemini-web-search-provider.ts";

          const targetSha = process.env.PROOF_TARGET_SHA;
          const harnessParentSha = process.env.PROOF_HARNESS_PARENT_SHA;
          const configuredEnvName = "OPENCLAW_PROOF_GEMINI_CONFIGURED";
          const missingEnvName = "OPENCLAW_PROOF_GEMINI_MISSING";
          const configuredCredential = randomBytes(24).toString("hex");
          const ambientCredential = randomBytes(24).toString("hex");
          const providerCredential = randomBytes(24).toString("hex");
          const sockets = new Set();
          const capture = {
            proxyConnectCount: 0,
            originRequestCount: 0,
            proxyTargetMatched: false,
            originSocketLoopback: false,
            requestMethodMatched: false,
            requestPathMatched: false,
            requestToolMatched: false,
            configuredHeaderMatched: false,
            ambientHeaderRejected: false,
            providerHeaderRejected: false,
          };

          const trackSocket = (socket) => {
            sockets.add(socket);
            socket.once("close", () => sockets.delete(socket));
          };

          const origin = createServer((request, response) => {
            capture.originRequestCount += 1;
            capture.originSocketLoopback = request.socket.remoteAddress === "127.0.0.1";
            capture.requestMethodMatched = request.method === "POST";
            capture.requestPathMatched =
              request.url === "/v1beta/models/gemini-2.5-flash:generateContent";
            const header = request.headers["x-goog-api-key"];
            capture.configuredHeaderMatched = header === configuredCredential;
            capture.ambientHeaderRejected = header !== ambientCredential;
            capture.providerHeaderRejected = header !== providerCredential;

            const chunks = [];
            request.on("data", (chunk) => chunks.push(chunk));
            request.on("end", () => {
              try {
                const body = JSON.parse(Buffer.concat(chunks).toString("utf8"));
                capture.requestToolMatched =
                  Array.isArray(body?.tools) && body.tools[0]?.google_search !== undefined;
              } catch {
                capture.requestToolMatched = false;
              }
              response.writeHead(200, { "content-type": "application/json" });
              response.end(
                JSON.stringify({
                  candidates: [
                    {
                      content: { parts: [{ text: "Exact-head runtime proof response." }] },
                      groundingMetadata: { groundingChunks: [] },
                    },
                  ],
                }),
              );
            });
          });
          origin.on("connection", trackSocket);

          const proxy = createServer((_request, response) => {
            response.writeHead(405);
            response.end();
          });
          proxy.on("connection", trackSocket);
          proxy.on("connect", (request, clientSocket, head) => {
            capture.proxyConnectCount += 1;
            capture.proxyTargetMatched = request.url === "gemini-proof.example:80";
            const upstreamSocket = connect(origin.address().port, "127.0.0.1", () => {
              clientSocket.write("HTTP/1.1 200 Connection Established\r\n\r\n");
              if (head.length > 0) {
                upstreamSocket.write(head);
              }
              clientSocket.pipe(upstreamSocket);
              upstreamSocket.pipe(clientSocket);
            });
            trackSocket(upstreamSocket);
            upstreamSocket.on("error", () => clientSocket.destroy());
          });

          const listen = (server) =>
            new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(0, "127.0.0.1", resolve);
            });
          const close = (server) =>
            new Promise((resolve) => {
              server.close(() => resolve());
            });

          let successResult = false;
          let missingRefFailClosed = false;
          let successProxyConnectCount = 0;
          let successOriginRequestCount = 0;
          try {
            await listen(origin);
            await listen(proxy);
            const proxyAddress = proxy.address();
            if (!proxyAddress || typeof proxyAddress === "string") {
              throw new Error("proof proxy did not bind");
            }
            const proxyUrl = `http://127.0.0.1:${proxyAddress.port}`;
            process.env.HTTP_PROXY = proxyUrl;
            process.env.http_proxy = proxyUrl;
            process.env.HTTPS_PROXY = proxyUrl;
            process.env.https_proxy = proxyUrl;
            process.env.NO_PROXY = "";
            process.env.no_proxy = "";
            process.env[configuredEnvName] = configuredCredential;
            process.env.GEMINI_API_KEY = ambientCredential;

            const createTool = (envName) => {
              const provider = createGeminiWebSearchProvider();
              return provider.createTool({
                config: {
                  plugins: {
                    entries: {
                      google: {
                        config: {
                          webSearch: {
                            apiKey: { source: "env", provider: "default", id: envName },
                            baseUrl: "http://gemini-proof.example/v1beta",
                            model: "gemini-2.5-flash",
                          },
                        },
                      },
                    },
                  },
                  models: {
                    providers: {
                      google: { apiKey: providerCredential },
                    },
                  },
                },
                searchConfig: { provider: "gemini", cacheTtlMinutes: 0 },
              });
            };

            const successTool = createTool(configuredEnvName);
            const success = await successTool.execute({ query: "exact head configured ref proof" });
            successResult = success?.provider === "gemini" && !("error" in success);
            successProxyConnectCount = capture.proxyConnectCount;
            successOriginRequestCount = capture.originRequestCount;

            delete process.env[missingEnvName];
            const missingTool = createTool(missingEnvName);
            const missing = await missingTool.execute({ query: "exact head missing ref proof" });
            missingRefFailClosed = missing?.error === "missing_gemini_api_key";
          } catch {
            successResult = false;
          } finally {
            for (const socket of sockets) {
              socket.destroy();
            }
            await Promise.all([close(proxy), close(origin)]);
          }

          const proof = {
            targetSha,
            harnessParentSha,
            vendorAuthClaimed: false,
            exactHeadChecked: targetSha === "01c4cb3bcc942d2a3a8af91ecd3aa3b2a9c860f9",
            realProviderEntry: true,
            trustedEnvProxyPath: true,
            realProxySocket: capture.proxyConnectCount === 1,
            realOriginSocket: capture.originSocketLoopback,
            proxyTargetMatched: capture.proxyTargetMatched,
            requestMethodMatched: capture.requestMethodMatched,
            requestPathMatched: capture.requestPathMatched,
            requestToolMatched: capture.requestToolMatched,
            configuredSecretRefWon: capture.configuredHeaderMatched,
            ambientCredentialRejected: capture.ambientHeaderRejected,
            providerCredentialRejected: capture.providerHeaderRejected,
            successResult,
            successProxyConnectCount,
            successOriginRequestCount,
            missingRefFailClosed,
            missingRefProxyCountUnchanged: capture.proxyConnectCount === successProxyConnectCount,
            missingRefOriginCountUnchanged: capture.originRequestCount === successOriginRequestCount,
          };
          await mkdir(".artifacts/pr104672-exact-head-proof", { recursive: true });
          await writeFile(
            ".artifacts/pr104672-exact-head-proof/proof.json",
            `${JSON.stringify(proof, null, 2)}\n`,
          );
          console.log(JSON.stringify(proof));
          if (Object.entries(proof).some(([key, value]) => key !== "vendorAuthClaimed" && value === false)) {
            throw new Error("exact-head runtime proof invariant failed");
          }
          NODE

      - name: Upload proof artifact
        id: upload-proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr104672-gemini-secretref-exact-head-proof
          path: target/.artifacts/pr104672-exact-head-proof/proof.json
          if-no-files-found: error
          retention-days: 90

      - name: Record artifact digest
        run: |
          test -n "${{ steps.upload-proof.outputs.artifact-digest }}"
          echo "artifactDigest=${{ steps.upload-proof.outputs.artifact-digest }}"
