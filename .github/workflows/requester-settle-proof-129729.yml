name: Requester Settle Gateway Proof
run-name: Requester settle proof ${{ github.sha }}

on:
  push:
    branches:
      - "proof/129729-*"

permissions:
  contents: read

concurrency:
  group: requester-settle-proof-${{ github.sha }}
  cancel-in-progress: false

env:
  OPENCLAW_BUILD_PRIVATE_QA: "1"
  OPENCLAW_VITEST_MAX_WORKERS: "1"

jobs:
  gateway-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$expected_sha" = "$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup pnpm store cache
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: "24"
          cache-mode: restore

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build private QA runtime
        run: corepack pnpm build

      - name: Run production Gateway recovery proof
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs test/gateway-restored-requester-settle.e2e.test.ts \
            --reporter=dot 2>&1 | tee "$RUNNER_TEMP/requester-settle-proof.log"

      - name: Upload proof log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: requester-settle-proof-${{ github.sha }}
          path: ${{ runner.temp }}/requester-settle-proof.log
          if-no-files-found: ignore
