name: PR 103113 exact-head focused provider-cache proof

on:
  push:
    branches:
      - proof/pr103113-exact-head-20260810-r3

permissions: {}

jobs:
  runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 94ebda1921dabb1e3b8f4d37d835a381347b3902
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout exact PR head anonymously
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/openclaw/openclaw.git
          git fetch --depth=1 origin refs/pull/103113/head
          git checkout --detach FETCH_HEAD

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile

      # Canonical exact-head CI owns build and type gates; this fork job proves only
      # the provider-selection/cache boundary that prompted the review finding.
      - name: Prove recovered provider cache identity through the runtime tool
        shell: bash
        run: |
          set -euo pipefail
          proof_script="src/agents/tools/web-fetch.provider-cache.proof.test.ts"
          trap 'rm -f "$proof_script"' EXIT
          cat >"$proof_script" <<'NODE'
          import assert from "node:assert/strict";
          import { createServer } from "node:http";
          import { test } from "vitest";
          import { resolveWebFetchDefinition } from "../../web-fetch/runtime.js";
          import { createWebFetchTool } from "./web-fetch.js";

          test("keeps recovered provider cache entries under the recovered provider", async () => {
            let directRequests = 0;
            let providerRequests = 0;
            let requestedUrl = "";
            const server = createServer((request, response) => {
            if (request.url === "/target") {
              directRequests += 1;
              response.writeHead(503, { "content-type": "text/plain" });
              response.end("direct fetch unavailable");
              return;
            }
            if (request.url === "/v2/scrape" && request.method === "POST") {
              providerRequests += 1;
              const chunks = [];
              request.on("data", (chunk) => chunks.push(chunk));
              request.on("end", () => {
                const body = JSON.parse(Buffer.concat(chunks).toString("utf8"));
                requestedUrl = body.url;
                response.writeHead(200, { "content-type": "application/json" });
                response.end(
                  JSON.stringify({
                    success: true,
                    data: {
                      markdown: "# Recovered through loopback Firecrawl",
                      metadata: {
                        title: "Provider cache proof",
                        sourceURL: body.url,
                        statusCode: 200,
                      },
                    },
                  }),
                );
              });
              return;
            }
            response.writeHead(404);
            response.end();
            });

            await new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(0, "127.0.0.1", resolve);
            });
            const address = server.address();
            assert(address && typeof address === "object");
            const targetUrl = `http://proof.example:${address.port}/target`;
            const baseUrl = `http://127.0.0.1:${address.port}`;
            const lookupFn = async (hostname) => {
              assert.equal(hostname, "proof.example");
              return [{ address: "127.0.0.1", family: 4 }];
            };
            const sharedConfig = {
            plugins: {
              entries: {
                firecrawl: {
                  enabled: true,
                  config: {
                    webFetch: {
                      apiKey: "redacted-proof-key",
                      baseUrl,
                    },
                  },
                },
              },
            },
            tools: {
              web: {
                fetch: {
                  cacheTtlMinutes: 15,
                  timeoutSeconds: 5,
                  ssrfPolicy: { dangerouslyAllowPrivateNetwork: true },
                },
              },
            },
            };

            const configuredResolution = resolveWebFetchDefinition({
              config: {},
              runtimeWebFetch: {
                providerConfigured: "removed-provider",
                providerSource: "configured",
                selectedProvider: "removed-provider",
                selectedProviderKeySource: "config",
                diagnostics: [],
              },
              preferRuntimeProviders: true,
            });
            assert.equal(configuredResolution, null);

            try {
            const recoveredTool = createWebFetchTool({
              config: sharedConfig,
              sandboxed: false,
              runtimeWebFetch: {
                providerSource: "auto-detect",
                selectedProvider: "removed-provider",
                selectedProviderKeySource: "proof",
                diagnostics: [],
              },
              lookupFn,
            });
            assert(recoveredTool?.execute);
            const recovered = await recoveredTool.execute("proof-auto-recovered", {
              url: targetUrl,
            });
            assert.equal(recovered.details.externalContent.provider, "firecrawl");
            assert.match(recovered.details.text, /Recovered through loopback Firecrawl/);

            const configuredTool = createWebFetchTool({
              config: {
                ...sharedConfig,
                tools: {
                  web: {
                    fetch: {
                      ...sharedConfig.tools.web.fetch,
                      provider: "removed-provider",
                    },
                  },
                },
              },
              sandboxed: false,
              runtimeWebFetch: {
                providerConfigured: "removed-provider",
                providerSource: "configured",
                selectedProvider: "removed-provider",
                selectedProviderKeySource: "config",
                diagnostics: [],
              },
              lookupFn,
            });
            assert(configuredTool?.execute);
            await assert.rejects(
              configuredTool.execute("proof-configured-unavailable", { url: targetUrl }),
              /Web fetch failed \(503\)/,
            );

            assert.equal(requestedUrl, targetUrl);
            assert.equal(directRequests, 2);
            assert.equal(providerRequests, 1);
            console.log(
              "WEB_FETCH_PROVIDER_CACHE_PROOF_103113_R3",
              JSON.stringify({
                head: process.env.TARGET_SHA,
                recoveredProvider: recovered.details.externalContent.provider,
                configuredSelectionFailedClosed: configuredResolution === null,
                directRequests,
                providerRequests,
                endpoint: "[redacted-loopback]",
              }),
            );
            } finally {
              await new Promise((resolve, reject) => {
                server.close((error) => (error ? reject(error) : resolve()));
              });
            }
          });
          NODE
          corepack pnpm test "$proof_script"
