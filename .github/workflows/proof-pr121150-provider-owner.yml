name: PR 121150 exact-head bundled compat proof

on:
  push:
    branches:
      - proof/pr121150-bundled-compat-run-20260810

permissions: {}

jobs:
  bundled-compat-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 098b423d836e49a2004bf8e18386eeee8afbad18
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout exact PR head anonymously
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/Leon-SK668/openclaw.git
          git fetch --depth=1 origin refs/heads/proof/pr121150-candidate-bundled-compat-20260810
          git checkout --detach FETCH_HEAD

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile

      - name: Check focused formatting
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/oxfmt --check \
            src/plugins/bundled-compat.ts \
            src/plugins/bundled-compat.test.ts

      - name: Run bundled compat regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs src/plugins/bundled-compat.test.ts

      - name: Prove alias disable through the production web-provider owner
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { resolvePluginWebSearchProviders } from "./src/plugins/web-search-providers.runtime.ts";
          import { resolveBundledWebSearchResolutionConfig } from "./src/plugins/web-search-providers.shared.ts";

          const workspaceDir = process.cwd();
          const aliasConfig = {
            plugins: {
              entries: {
                "GOOGLE-GEMINI-CLI": {
                  enabled: false,
                  config: { webSearch: { model: "gemini-3-flash-preview" } },
                },
              },
            },
          };
          const common = {
            workspaceDir,
            env: process.env,
            onlyPluginIds: ["google"],
            activate: true,
            cache: false,
            mode: "runtime",
          };

          const resolution = resolveBundledWebSearchResolutionConfig({
            config: aliasConfig,
            workspaceDir,
            env: process.env,
          });
          const resolvedEntries = resolution.config?.plugins?.entries ?? {};
          assert.equal(
            Object.hasOwn(resolvedEntries, "GOOGLE-GEMINI-CLI"),
            false,
            "bundled compat retained the legacy alias entry",
          );
          assert.equal(
            resolvedEntries.google?.enabled,
            false,
            "bundled compat did not preserve the canonicalized explicit disable",
          );
          assert.deepEqual(
            resolvedEntries.google?.config,
            { webSearch: { model: "gemini-3-flash-preview" } },
            "bundled compat did not preserve the canonicalized plugin config",
          );

          const enabledProviders = resolvePluginWebSearchProviders({
            ...common,
            config: { plugins: { allow: ["google"] } },
          });
          assert(
            enabledProviders.some(
              (provider) => provider.pluginId === "google" && provider.id === "gemini",
            ),
            "positive control did not resolve the bundled google web-search provider",
          );

          const disabledProviders = resolvePluginWebSearchProviders({
            ...common,
            config: aliasConfig,
          });
          assert.equal(
            disabledProviders.some(
              (provider) => provider.pluginId === "google" && provider.id === "gemini",
            ),
            false,
            "explicitly disabled alias activated the canonical bundled web-search provider",
          );

          console.log(
            "BUNDLED_COMPAT_ALIAS_DISABLE_PROOF_121150",
            JSON.stringify({
              head: process.env.TARGET_SHA,
              boundary: "resolvePluginWebSearchProviders",
              canonicalEntry: resolvedEntries.google,
              positiveControl: "google:gemini",
              disabledAliasProviderCount: disabledProviders.length,
              credentials: "none",
            }),
          );
          NODE
