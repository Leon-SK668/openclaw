name: Feature 9876 visual proof

on:
  push:
    branches:
      - leon/proof-feature-9876-session-red-main-20260829

permissions:
  contents: read

jobs:
  before:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: proof
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: b55dbcea5a029773c5a95ef229e3395ae1844541
          path: source
      - name: Apply visual proof harness
        run: git -C source apply ../proof/.github/proof/feature-9876-visual-proof.patch
      - name: Capture current main
        env:
          OPENCLAW_PROOF_PNG: ${{ runner.temp }}/feature-9876-before.png
        run: swift test --package-path source/apps/macos --filter Feature9876VisualProofTests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-9876-before
          path: ${{ runner.temp }}/feature-9876-before.png

  after:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Apply visual proof harness
        run: git apply .github/proof/feature-9876-visual-proof.patch
      - name: Capture implementation
        env:
          OPENCLAW_PROOF_PNG: ${{ runner.temp }}/feature-9876-after.png
        run: swift test --package-path apps/macos --filter Feature9876VisualProofTests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: feature-9876-after
          path: ${{ runner.temp }}/feature-9876-after.png
